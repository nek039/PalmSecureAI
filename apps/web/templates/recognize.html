{% extends "base.html" %}

{% block page_title %}掌纹识别{% endblock %}

{% block extra_styles %}
<style>
/* 识别页面 - Crystalline Light Enhanced */
.recognize-page {
    padding: 0;
}

.recognize-container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--space-6);
    align-items: stretch;
}

/* 页面头部 */
.page-header {
    margin-bottom: var(--space-6);
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.page-header h1 {
    margin: 0;
    font-family: var(--font-display);
    font-size: var(--text-2xl);
    color: var(--text-primary);
    font-weight: 600;
    letter-spacing: -0.02em;
}

.page-header .subtitle {
    color: var(--text-muted);
    font-size: var(--text-sm);
}

/* 左侧上传区域 */
.upload-section {
    background: var(--bg-raised);
    border-radius: var(--radius-lg);
    border: 1px solid var(--border-light);
    padding: var(--space-6);
    position: relative;
}

.upload-section h3 {
    margin: 0 0 var(--space-5) 0;
    font-size: var(--text-base);
    color: var(--text-primary);
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: var(--space-2);
}

.upload-section h3::before {
    content: '';
    width: 3px;
    height: 16px;
    border-radius: 2px;
    background: linear-gradient(180deg, #0EA5E9, #059669);
}

.upload-section h3 svg {
    color: var(--primary-color);
}

/* 上传卡片 - 与注册页面一致的动画 */
.upload-card {
    padding: var(--space-10) var(--space-6);
    text-align: center;
    cursor: pointer;
    transition: var(--transition-normal);
    background: linear-gradient(135deg, var(--bg-surface) 0%, var(--bg-base) 100%);
    border-radius: var(--radius-lg);
    border: 2px dashed var(--border-default);
    position: relative;
    overflow: hidden;
}

.upload-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center, var(--primary-50) 0%, transparent 70%);
    opacity: 0;
    transition: var(--transition-normal);
}

.upload-card:hover::before,
.upload-card.drag-over::before {
    opacity: 1;
}

.upload-card:hover {
    border-color: var(--primary-color);
    transform: translateY(-2px);
}

.upload-card.drag-over {
    border-color: var(--primary-color);
    border-style: solid;
    box-shadow: 0 0 0 4px rgba(5, 150, 105, 0.1);
}

.upload-card .upload-icon {
    width: 72px;
    height: 72px;
    margin: 0 auto var(--space-4);
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--radius-xl);
    background: linear-gradient(135deg, var(--primary-50) 0%, var(--primary-100) 100%);
    color: var(--primary-600);
    transition: var(--transition-bounce);
    position: relative;
}

.upload-card .upload-icon::after {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: var(--radius-xl);
    border: 2px solid var(--primary-200);
    opacity: 0;
    transition: var(--transition-normal);
}

.upload-card:hover .upload-icon {
    transform: scale(1.08);
}

.upload-card:hover .upload-icon::after {
    opacity: 1;
    animation: pulse-ring 1.5s ease-out infinite;
}

@keyframes pulse-ring {
    0% { transform: scale(1); opacity: 1; }
    100% { transform: scale(1.2); opacity: 0; }
}

.upload-card .upload-icon svg {
    width: 28px;
    height: 28px;
}

.upload-card p {
    margin: 0 0 var(--space-2) 0;
    color: var(--text-secondary);
    font-size: var(--text-base);
}

.upload-card small {
    color: var(--text-muted);
    font-size: var(--text-sm);
}

.upload-card a {
    color: var(--primary-color);
    text-decoration: none;
    font-weight: 600;
}

.upload-card a:hover {
    text-decoration: underline;
}

/* 图片预览 */
.preview-section {
    margin-top: var(--space-6);
    text-align: center;
    display: none;
}

.preview-section.show {
    display: block;
}

.preview-section img {
    max-width: 100%;
    max-height: 280px;
    border-radius: var(--radius-md);
    border: 1px solid var(--border-light);
}

.preview-info {
    margin-top: var(--space-4);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-4);
}

.preview-quality {
    display: flex;
    align-items: center;
    gap: var(--space-2);
}

.preview-quality .label {
    color: var(--text-muted);
    font-size: var(--text-sm);
}

.preview-quality .value {
    font-weight: 700;
    font-size: var(--text-lg);
    color: var(--primary-color);
}

/* 示例图片库 */
.sample-gallery {
    margin-top: var(--space-6);
    padding: var(--space-5);
    background: var(--bg-surface);
    border-radius: var(--radius-md);
    border: 1px solid var(--border-light);
}

.sample-gallery h3 {
    margin: 0 0 var(--space-4) 0;
    font-size: var(--text-sm);
    color: var(--text-primary);
    font-weight: 600;
}

.sample-gallery h3 small {
    color: var(--text-muted);
    font-weight: normal;
}

.sample-users {
    display: flex;
    gap: var(--space-2);
    margin-bottom: var(--space-4);
    flex-wrap: wrap;
}

.sample-user-btn {
    padding: var(--space-2) var(--space-4);
    border: 1px solid var(--border-default);
    border-radius: var(--radius-full);
    cursor: pointer;
    font-size: var(--text-xs);
    font-weight: 500;
    color: var(--text-secondary);
    background: var(--bg-raised);
    transition: var(--transition-fast);
}

.sample-user-btn:hover {
    border-color: var(--primary-color);
    color: var(--primary-color);
}

.sample-user-btn.active {
    color: white;
    background: var(--primary-gradient);
    border-color: transparent;
}

.sample-images {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: var(--space-2);
}

.sample-item {
    position: relative;
    border-radius: var(--radius-sm);
    overflow: hidden;
    cursor: pointer;
    aspect-ratio: 1;
    border: 1px solid var(--border-light);
    transition: var(--transition-fast);
}

.sample-item:hover {
    transform: scale(1.03);
    border-color: var(--primary-color);
}

.sample-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.sample-item .sample-label {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 4px;
    background: rgba(0, 0, 0, 0.7);
    color: white;
    font-size: 9px;
    text-align: center;
}

/* 提示区域 */
.tips-inline {
    margin-top: var(--space-5);
    padding: var(--space-4);
    background: var(--primary-50);
    border-radius: var(--radius-md);
    border: 1px solid rgba(5, 150, 105, 0.15);
}

.tips-inline h4 {
    margin: 0 0 var(--space-3) 0;
    font-size: var(--text-base);
    color: var(--primary-700);
    font-weight: 600;
}

.tips-inline h4::before {
    content: '💡 ';
}

.tips-inline ul {
    margin: 0;
    padding-left: var(--space-5);
    color: var(--text-primary);
    font-size: var(--text-sm);
    line-height: 1.8;
}

.tips-inline li {
    margin-bottom: var(--space-1);
}

.tips-inline li::marker {
    color: var(--primary-color);
}

/* 右侧结果 */
.result-section {
    display: flex;
    flex-direction: column;
    gap: var(--space-5);
}

.result-section > * {
    flex: 1;
    min-height: 0;
}

.result-card, .history-card {
    background: var(--bg-raised);
    border-radius: var(--radius-lg);
    border: 1px solid var(--border-light);
    padding: var(--space-6);
    display: flex;
    flex-direction: column;
}

.result-card h2, .history-card h2 {
    margin: 0 0 var(--space-5) 0;
    flex-shrink: 0;
}

/* 结果区域自动扩展 */
.result-placeholder, .result-display {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

/* 历史列表自动扩展 */
.history-list {
    flex: 1;
    overflow-y: auto;
    min-height: 0;
}

.btn-clear-history {
    flex-shrink: 0;
    margin: 0 0 var(--space-5) 0;
    font-size: var(--text-base);
    color: var(--text-primary);
    font-weight: 600;
    display: flex;
    align-items: center;
}

/* 结果占位 */
.result-placeholder {
    text-align: center;
    padding: var(--space-12) var(--space-6);
    color: var(--text-muted);
    background: var(--bg-surface);
    border-radius: var(--radius-md);
    border: 1px solid var(--border-light);
}

.result-placeholder .icon {
    width: 64px;
    height: 64px;
    margin: 0 auto var(--space-4);
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--radius-lg);
    background: var(--bg-raised);
    border: 1px solid var(--border-light);
    color: var(--text-ghost);
}

.result-placeholder .icon svg {
    width: 28px;
    height: 28px;
}

/* 结果显示 - 增强版 */
.result-display {
    display: none;
}

.result-display.show {
    display: block;
    animation: slideUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.result-status {
    display: flex;
    align-items: center;
    gap: var(--space-4);
    padding: var(--space-5);
    border-radius: var(--radius-lg);
    margin-bottom: var(--space-5);
    background: var(--bg-surface);
    border: 1px solid var(--border-light);
    transition: var(--transition-normal);
}

.result-status.success {
    background: linear-gradient(135deg, rgba(5, 150, 105, 0.08) 0%, rgba(16, 185, 129, 0.04) 100%);
    border-color: rgba(5, 150, 105, 0.2);
}

.result-status.fail {
    background: linear-gradient(135deg, rgba(239, 68, 68, 0.08) 0%, rgba(220, 38, 38, 0.04) 100%);
    border-color: rgba(239, 68, 68, 0.15);
}

.status-icon {
    width: 48px;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--radius-lg);
    transition: var(--transition-bounce);
}

.result-status.success .status-icon {
    color: white;
    background: linear-gradient(135deg, #059669 0%, #10B981 100%);
    box-shadow: 0 4px 16px rgba(5, 150, 105, 0.35);
}

.result-status.fail .status-icon {
    color: white;
    background: linear-gradient(135deg, #EF4444 0%, #F87171 100%);
    box-shadow: 0 4px 16px rgba(239, 68, 68, 0.35);
}

.result-status.success .status-icon svg {
    animation: check-in 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes check-in {
    0% { transform: scale(0) rotate(-45deg); }
    50% { transform: scale(1.2) rotate(5deg); }
    100% { transform: scale(1) rotate(0deg); }
}

.result-status.fail .status-icon svg {
    animation: x-in 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes x-in {
    0% { transform: scale(0) rotate(45deg); }
    50% { transform: scale(1.15); }
    100% { transform: scale(1) rotate(0deg); }
}

/* 结果状态文字 - 限定在 .result-status 内，避免影响 sidebar 的系统在线 */
.result-status .status-text {
    font-weight: 600;
    font-size: var(--text-lg);
    color: var(--text-primary);
}

.result-status.success .status-text {
    color: var(--primary-700);
}

.result-status.fail .status-text {
    color: #DC2626;
}

/* 结果信息 */
.result-info {
    border-radius: var(--radius-md);
    overflow: hidden;
    background: var(--bg-surface);
    border: 1px solid var(--border-light);
}

.info-row {
    display: flex;
    justify-content: space-between;
    padding: var(--space-3) var(--space-4);
    border-bottom: 1px solid var(--border-light);
    font-size: var(--text-sm);
}

.info-row:last-child {
    border-bottom: none;
}

.info-row .label {
    color: var(--text-muted);
}

.info-row .value {
    font-weight: 600;
    color: var(--text-primary);
}

.info-row .value.highlight {
    color: var(--primary-color);
}

/* 历史列表 */
.history-list {
    max-height: 320px;
    overflow-y: auto;
}

.history-item {
    display: flex;
    align-items: center;
    gap: var(--space-3);
    padding: var(--space-3);
    border-radius: var(--radius-sm);
    margin-bottom: var(--space-2);
    background: var(--bg-surface);
    border: 1px solid var(--border-light);
}

.history-status {
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--radius-sm);
    font-size: var(--text-xs);
    font-weight: 700;
}

.history-item.success .history-status {
    color: white;
    background: var(--primary-gradient);
}

.history-item.fail .history-status {
    color: white;
    background: linear-gradient(135deg, #9CA3AF, #6B7280);
}

.history-info {
    flex: 1;
}

.history-user {
    font-weight: 600;
    font-size: var(--text-sm);
    color: var(--text-primary);
}

.history-time {
    font-size: var(--text-xs);
    color: var(--text-muted);
}

.history-similarity {
    font-weight: 600;
    font-size: var(--text-sm);
    color: var(--primary-color);
}

.history-empty {
    text-align: center;
    color: var(--text-muted);
    padding: var(--space-8);
    font-size: var(--text-sm);
}

/* 统计栏 */
.stats-bar {
    display: flex;
    justify-content: space-around;
    margin-top: var(--space-6);
    padding: var(--space-6);
    background: var(--bg-raised);
    border-radius: var(--radius-lg);
    border: 1px solid var(--border-light);
}

.stat-item {
    text-align: center;
}

.stat-label {
    display: block;
    font-size: var(--text-xs);
    color: var(--text-muted);
    margin-bottom: var(--space-2);
    text-transform: uppercase;
    letter-spacing: 0.05em;
}

.stat-value {
    font-family: var(--font-display);
    font-size: var(--text-3xl);
    font-weight: 600;
    color: var(--text-primary);
}

.stat-value.success { color: var(--success-color); }
.stat-value.fail { color: var(--text-muted); }

/* 按钮 */
.btn-clear-history {
    margin-top: var(--space-4);
    padding: var(--space-2) var(--space-4);
    background: transparent;
    border: 1px solid var(--border-default);
    border-radius: var(--radius-sm);
    color: var(--text-muted);
    cursor: pointer;
    font-size: var(--text-xs);
    transition: var(--transition-fast);
}

.btn-clear-history:hover {
    color: var(--danger-color);
    border-color: var(--danger-color);
}

.btn-clear-preview {
    padding: var(--space-2) var(--space-4);
    background: var(--bg-raised);
    border: 1px solid var(--border-default);
    border-radius: var(--radius-sm);
    color: var(--text-secondary);
    cursor: pointer;
    font-size: var(--text-xs);
    transition: var(--transition-fast);
}

.btn-clear-preview:hover {
    color: var(--text-primary);
    border-color: var(--border-strong);
}

/* 响应式 */
@media (max-width: 900px) {
    .recognize-container {
        grid-template-columns: 1fr;
    }
}
</style>
{% endblock %}

{% block content %}
<div class="recognize-page">
    <div class="recognize-container">
        <!-- 左侧 -->
        <div class="upload-section">
            <h3>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="17 8 12 3 7 8"/>
                    <line x1="12" y1="3" x2="12" y2="15"/>
                </svg>
                上传掌纹图像
            </h3>
            <div class="upload-card" id="dropZone">
                <div class="upload-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="17 8 12 3 7 8"/>
                        <line x1="12" y1="3" x2="12" y2="15"/>
                    </svg>
                </div>
                <p>拖拽图片或 <a href="#" id="clickUpload">点击选择</a></p>
                <small>支持 JPG、PNG 格式</small>
            </div>
            <input type="file" id="fileInput" accept="image/*" style="display: none;">

            <!-- 预览 -->
            <div class="preview-section" id="previewSection">
                <img id="previewImg" src="" alt="预览">
                <div class="preview-info">
                    <div class="preview-quality">
                        <span class="label">图像质量:</span>
                        <span class="value" id="previewQuality">--</span>
                    </div>
                    <button class="btn-clear-preview" id="clearBtn">清除</button>
                </div>
            </div>

            <!-- 示例库 -->
            <div class="sample-gallery">
                <h3>示例图片库 <small>(来自训练集)</small></h3>
                <div class="sample-users" id="sampleUsers"></div>
                <div class="sample-images" id="sampleImages"></div>
            </div>
        </div>

        <!-- 右侧 -->
        <div class="result-section">
            <div class="result-card">
                <h2>识别结果</h2>

                <div class="result-placeholder" id="resultPlaceholder">
                    <div class="icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"/>
                            <path d="m21 21-4.3-4.3"/>
                        </svg>
                    </div>
                    <p>等待识别</p>
                    <small>请在左侧上传掌纹图像</small>
                </div>

                <div class="result-display" id="resultDisplay">
                    <div class="result-status" id="resultStatus"></div>
                    <div class="result-info" id="resultInfo"></div>
                </div>
            </div>

            <div class="history-card">
                <h2>识别历史</h2>
                <div class="history-list" id="historyList">
                    <div class="history-empty"><p>暂无记录</p></div>
                </div>
                <button class="btn-clear-history" id="clearHistoryBtn">清除历史</button>
            </div>
        </div>
    </div>

    <!-- 统计 -->
    <div class="stats-bar">
        <div class="stat-item">
            <span class="stat-label">总识别次数</span>
            <span class="stat-value" id="totalCount">0</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">成功</span>
            <span class="stat-value success" id="successCount">0</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">失败</span>
            <span class="stat-value fail" id="failCount">0</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">成功率</span>
            <span class="stat-value" id="successRate">0%</span>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
(function() {
    // 变量
    let imageData = null;
    let history = [];
    let stats = { total: 0, success: 0, fail: 0 };

    // DOM
    const fileInput = document.getElementById('fileInput');
    const dropZone = document.getElementById('dropZone');
    const previewSection = document.getElementById('previewSection');
    const previewImg = document.getElementById('previewImg');
    const previewQuality = document.getElementById('previewQuality');
    const clearBtn = document.getElementById('clearBtn');
    const clearHistoryBtn = document.getElementById('clearHistoryBtn');
    const resultPlaceholder = document.getElementById('resultPlaceholder');
    const resultDisplay = document.getElementById('resultDisplay');
    const resultStatus = document.getElementById('resultStatus');
    const resultInfo = document.getElementById('resultInfo');

    // 初始化
    document.addEventListener('DOMContentLoaded', function() {
        loadFromStorage();
        renderHistory();
        updateStats();
        initSampleGallery();
        setupEvents();
    });

    // 事件
    function setupEvents() {
        // 点击上传区域
        dropZone.addEventListener('click', function(e) {
            // 如果点击的是链接，不触发 dropZone 的点击
            if (e.target.tagName !== 'A') {
                fileInput.click();
            }
        });

        // 点击"点击选择"链接
        document.getElementById('clickUpload').addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            fileInput.click();
        });

        fileInput.addEventListener('change', function(e) { if (e.target.files[0]) handleFile(e.target.files[0]); });

        dropZone.addEventListener('dragover', function(e) { e.preventDefault(); dropZone.classList.add('drag-over'); });
        dropZone.addEventListener('dragleave', function(e) { e.preventDefault(); dropZone.classList.remove('drag-over'); });
        dropZone.addEventListener('drop', function(e) {
            e.preventDefault();
            dropZone.classList.remove('drag-over');
            if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
        });

        clearBtn.addEventListener('click', clearPreview);
        clearHistoryBtn.addEventListener('click', clearHistory);
    }

    // 处理文件
    function handleFile(file) {
        if (!file.type.startsWith('image/')) {
            showToast('请选择图片文件', 'warning');
            return;
        }

        const reader = new FileReader();
        reader.onload = function(e) {
            imageData = e.target.result;
            previewImg.src = imageData;

            // 计算质量
            calcQuality(imageData, function(q) {
                previewQuality.textContent = Math.round(q * 100) + '%';
                previewSection.classList.add('show');
                doRecognize();
            });
        };
        reader.readAsDataURL(file);
    }

    // 计算质量
    function calcQuality(dataUrl, callback) {
        const img = new Image();
        img.onload = function() {
            const canvas = document.createElement('canvas');
            canvas.width = img.width;
            canvas.height = img.height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0);
            const d = ctx.getImageData(0, 0, canvas.width, canvas.height).data;

            let brightness = 0;
            for (let i = 0; i < d.length; i += 4) brightness += (d[i] + d[i+1] + d[i+2]) / 3;
            brightness /= d.length / 4;

            let variance = 0;
            for (let i = 0; i < d.length; i += 4) variance += Math.pow((d[i] + d[i+1] + d[i+2]) / 3 - brightness, 2);
            const contrast = Math.sqrt(variance / (d.length / 4));

            const bScore = 1 - Math.abs(brightness - 128) / 128;
            const cScore = Math.min(contrast / 50, 1);
            callback(bScore * 0.5 + cScore * 0.5);
        };
        img.src = dataUrl;
    }

    // 识别
    async function doRecognize() {
        if (!imageData) return;

        showLoading('正在识别...');

        try {
            const res = await fetch('/api/recognize', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ image: imageData })
            });
            const result = await res.json();
            hideLoading();

            if (result.success && result.data) {
                showResult(result.data);
                addHistory(result.data);
            } else {
                showToast('识别失败: ' + (result.message || '未知错误'), 'error');
            }
        } catch (err) {
            hideLoading();
            showToast('识别失败: ' + err.message, 'error');
        }
    }

    // 显示结果
    function showResult(data) {
        resultPlaceholder.style.display = 'none';
        resultDisplay.classList.add('show');

        const matched = data.matched;
        const userId = data.user_id || '--';
        const userName = (data.user_info && data.user_info.user_name) ? data.user_info.user_name : '未知';
        const similarity = data.similarity || 0;
        const quality = data.quality || 0;

        if (matched) {
            resultStatus.className = 'result-status success';
            resultStatus.innerHTML = '<span class="status-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg></span><span class="status-text">识别成功</span>';

            resultInfo.innerHTML =
                '<div class="info-row"><span class="label">用户 ID</span><span class="value">' + userId + '</span></div>' +
                '<div class="info-row"><span class="label">用户名</span><span class="value">' + userName + '</span></div>' +
                '<div class="info-row"><span class="label">相似度</span><span class="value highlight">' + (similarity * 100).toFixed(1) + '%</span></div>' +
                '<div class="info-row"><span class="label">质量评分</span><span class="value">' + Math.round(quality * 100) + '%</span></div>';

            stats.success++;
        } else {
            resultStatus.className = 'result-status fail';
            resultStatus.innerHTML = '<span class="status-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></span><span class="status-text">未匹配</span>';

            resultInfo.innerHTML =
                '<div class="info-row"><span class="label">结果</span><span class="value">未找到匹配用户</span></div>' +
                '<div class="info-row"><span class="label">最高相似度</span><span class="value">' + (similarity * 100).toFixed(1) + '%</span></div>' +
                '<div class="info-row"><span class="label">质量评分</span><span class="value">' + Math.round(quality * 100) + '%</span></div>';

            stats.fail++;
        }

        stats.total++;
        saveToStorage();
        updateStats();
    }

    // 添加历史
    function addHistory(data) {
        history.unshift({
            time: new Date().toISOString(),
            matched: data.matched,
            userId: data.user_id,
            similarity: data.similarity
        });
        if (history.length > 10) history.pop();
        saveToStorage();
        renderHistory();
    }

    // 渲染历史
    function renderHistory() {
        const list = document.getElementById('historyList');

        if (history.length === 0) {
            list.innerHTML = '<div class="history-empty"><p>暂无记录</p></div>';
            return;
        }

        list.innerHTML = history.map(function(item) {
            const cls = item.matched ? 'success' : 'fail';
            const icon = item.matched ? '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>' : '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
            const user = item.matched ? item.userId : '未匹配';
            const sim = (item.similarity * 100).toFixed(1) + '%';
            const time = formatTime(item.time);

            return '<div class="history-item ' + cls + '">' +
                '<div class="history-status">' + icon + '</div>' +
                '<div class="history-info"><div class="history-user">' + user + '</div><div class="history-time">' + time + '</div></div>' +
                '<div class="history-similarity">' + sim + '</div></div>';
        }).join('');
    }

    // 更新统计
    function updateStats() {
        document.getElementById('totalCount').textContent = stats.total;
        document.getElementById('successCount').textContent = stats.success;
        document.getElementById('failCount').textContent = stats.fail;

        const rate = stats.total > 0 ? (stats.success / stats.total * 100).toFixed(1) : '0';
        document.getElementById('successRate').textContent = rate + '%';
    }

    // 存储
    function saveToStorage() {
        localStorage.setItem('recognize_history', JSON.stringify(history));
        localStorage.setItem('recognize_stats', JSON.stringify(stats));
    }

    function loadFromStorage() {
        try {
            const h = localStorage.getItem('recognize_history');
            if (h) history = JSON.parse(h);
            const s = localStorage.getItem('recognize_stats');
            if (s) stats = JSON.parse(s);
        } catch (e) {}
    }

    // 清除
    function clearPreview() {
        imageData = null;
        previewSection.classList.remove('show');
        resultPlaceholder.style.display = 'block';
        resultDisplay.classList.remove('show');
        fileInput.value = '';
    }

    function clearHistory() {
        if (!confirm('确定清除所有历史？')) return;
        history = [];
        stats = { total: 0, success: 0, fail: 0 };
        localStorage.removeItem('recognize_history');
        localStorage.removeItem('recognize_stats');
        renderHistory();
        updateStats();
        showToast('已清除', 'success');
    }

    // 时间格式
    function formatTime(iso) {
        const d = new Date(iso);
        return d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
    }

    // 示例库
    function initSampleGallery() {
        const users = ['user_00', 'user_01', 'user_02', 'user_03'];
        const container = document.getElementById('sampleUsers');

        container.innerHTML = users.map(function(u) {
            return '<button class="sample-user-btn" data-user="' + u + '">' + u.replace('user_', 'User ') + '</button>';
        }).join('');

        container.querySelectorAll('.sample-user-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
                loadUserSamples(this.dataset.user);
                container.querySelectorAll('.sample-user-btn').forEach(function(b) { b.classList.remove('active'); });
                this.classList.add('active');
            });
        });
    }

    function loadUserSamples(userId) {
        const container = document.getElementById('sampleImages');
        let html = '';

        for (let i = 1; i <= 4; i++) {
            const path = '/static/samples/' + userId + '_' + String(i).padStart(3, '0') + '.png';
            html += '<div class="sample-item" data-path="' + path + '">' +
                '<img src="' + path + '" onerror="this.parentElement.style.display=\'none\'">' +
                '<div class="sample-label">Sample ' + i + '</div></div>';
        }

        container.innerHTML = html;

        container.querySelectorAll('.sample-item').forEach(function(item) {
            item.addEventListener('click', function() {
                loadSampleImage(this.dataset.path);
            });
        });
    }

    async function loadSampleImage(path) {
        try {
            const res = await fetch(path);
            const blob = await res.blob();
            handleFile(blob);
        } catch (e) {
            showToast('加载失败', 'error');
        }
    }
})();
</script>
